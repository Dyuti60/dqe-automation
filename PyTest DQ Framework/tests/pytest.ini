[pytest]
python_files = test_*.py
testpaths = .
pythonpath = ..
addopts = --strict-markers
markers =
    example: Framework usage examples that are excluded from production DQ runs.
    parquet_data: Data-quality tests comparing PostgreSQL expectations with Parquet targets.
    smoke: Basic dataset availability and readability checks.
    facility_name_min_time_spent_per_visit_date: Checks for the facility-name minimum-duration dataset.
    facility_type_avg_time_spent_per_visit_date: Checks for the facility-type average-duration dataset.
    patient_sum_treatment_cost_per_facility_type: Checks for the patient treatment-cost dataset.
